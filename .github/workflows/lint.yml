name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff==0.17.1
      - name: Run ruff
        run: ruff check custom_components tests
